[package]
name = "cuemap"
version = "0.7.2"
edition = "2021"
autobins = false
license = "BSL-1.1"
description = "High-performance temporal-associative memory engine for AI agents"
readme = "README.md"
repository = "https://github.com/cuemap-dev/cuemap"
homepage = "https://cuemap.dev"
keywords = ["ai", "memory", "agents", "retrieval", "rag"]
categories = ["database-implementations", "text-processing"]
exclude = [
    "/.github",
    "/benchmarks",
    "/evals",
    "/scripts",
    "/src/bin",
    "/tests/evals",
    "/vendor",
    "/assets/all-MiniLM-L6-v2",
    "**/.DS_Store",
    "**/__pycache__",
    "**/*.pyc",
]

[[bin]]
name = "cuemap"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
dashmap = "5.5"
uuid = { version = "1.6", features = ["v4", "serde", "v5"] }
rayon = "1.8"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
rand = "0.8"
chrono = "0.4"
indexmap = { version = "2.1", features = ["serde"] }
clap = { version = "4.4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
time = "=0.3.36"
regex = "1.10"
aho-corasick = "1.1"
reqwest = { version = "0.12.26", default-features = false, features = ["json", "blocking", "rustls-tls"] }
smallvec = "1.15.1"
notify = "8.2.0"
ignore = "0.4.22"
tree-sitter = "0.26.3"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.23.1"
tree-sitter-go = "0.23.3"
tree-sitter-html = "0.23.1"
tree-sitter-css = "0.23.1"
tree-sitter-java = "0.23.0"
tree-sitter-php = "0.23.0"
csv = "1.3"
serde_yaml = "0.9"
half = { version = "1.8.3", features = ["serde"] }
roxmltree = "0.20"
pdf-extract = "0.7.2"
docx-rs = "0.4"
calamine = "0.22"
digest = "0.10.7"
sha2 = "0.10.9"
hmac = "0.12.1"
ring = "0.17.14"
hex = "0.4.3"
globset = "=0.4.15"
walkdir = "2.5.0"
lru = "0.12.3"
unicode-segmentation = "1.12"
scraper = "0.21"
url = "2.5"
unicode-general-category = "1.1.0"
nlprule = "0.6"
subtle = "2.6.1"
axum-extra = { version = "0.9", features = ["multipart"] }
libc = "0.2"
object_store = { version = "0.11", features = ["aws", "gcp", "azure"] }
bytes = "1.5"
async-trait = "0.1"
futures = "0.3"
zstd = "0.13"
chacha20poly1305 = "0.10"
pbkdf2 = "0.12"
zeroize = { version = "1.7", features = ["derive"] }
base64 = "0.21"
ahash = "0.8"
toml = "1.0.3"
quick-xml = "0.39.2"
tokenizers = { version = "0.23.1", optional = true }

# ort rc.11+ no longer ships an Intel macOS distribution. Pin to rc.10,
# which covers Intel macOS and the other release targets.
ort = { version = "=2.0.0-rc.10", optional = true, features = ["coreml"] }

[features]
default = ["semantic-encoder"]
semantic-encoder = ["dep:ort", "dep:tokenizers"]

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }
tempfile = "3.8"
tower = { version = "0.4", features = ["util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[test]]
name = "engine"
path = "tests/engine/mod.rs"

[[test]]
name = "jobs"
path = "tests/jobs/mod.rs"

[[test]]
name = "normalization"
path = "tests/normalization/mod.rs"

[[test]]
name = "projects"
path = "tests/projects/mod.rs"

[[test]]
name = "taxonomy"
path = "tests/taxonomy/mod.rs"



[[test]]
name = "multi_tenant"
path = "tests/multi_tenant/mod.rs"

[[test]]
name = "nl"
path = "tests/nl/mod.rs"

[[test]]
name = "agent"
path = "tests/agent/mod.rs"

[[test]]
name = "facets"
path = "tests/facets/mod.rs"

[[test]]
name = "cuebridge"
path = "tests/cuebridge/mod.rs"
