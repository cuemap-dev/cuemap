[[memory_rules]]
id = "reading.current"
contains_any = ["book", "novel", "memoir", "biography", "reading", "read", "author"]
regex_any = [
  '''(?ix)\b(?:i|we)(?:\s+am|\s+are|'m|'re|’m|’re|\s+have\s+been|\s+has\s+been|'ve\s+been|’ve\s+been)?\s+(?:currently\s+|right\s+now\s+|still\s+)?(?:reading|devouring|rereading|re-reading|halfway\s+through|in\s+the\s+middle\s+of)\b'''
]
emits = ["media:book", "media:book_reading", "reading:current", "temporal:current"]

[[memory_rules]]
id = "reading.current_quoted_title"
regex_any = [
  '''(?ix)\b(?:i|we)(?:\s+am|\s+are|'m|\s+have\s+been|'ve\s+been)?\s+(?:currently\s+|right\s+now\s+|still\s+)?(?:reading|devouring|rereading|re-reading|halfway\s+through|in\s+the\s+middle\s+of)\b.{0,80}["“][^"”]{3,120}["”]'''
]
emits = ["media:book", "media:book_reading", "reading:current", "temporal:current"]

