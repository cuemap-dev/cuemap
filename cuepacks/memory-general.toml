name = "memory-general"
version = "0.1.0"
description = "General deterministic semantic cues for personal memory, chat logs, notes, and assistant answers."
enabled_by_default = true

[[query_rules]]
id = "memory.ordered_reconstruction"
contains_any = [
  "timeline", "sequence", "in order", "chronological", "chronologically",
  "progress", "progression", "evolved", "developed over time", "progressed",
  "what order"
]
regex_any = [
  '''(?i)\bhow\s+did\b.{0,120}\b(?:progress|progression|evolve|evolved|develop|developed)\b'''
]
labels = ["ordered_reconstruction"]

[[query_rules]]
id = "memory.multi_evidence_summary"
contains_any = [
  "summarize", "summary", "main points", "overall", "across the conversation",
  "across this conversation", "across the thread", "across this thread",
  "what happened across", "recap", "overview", "key points", "key details",
  "key features", "comprehensive summary", "comprehensive overview"
]
labels = ["multi_evidence_summary"]

[[query_rules]]
id = "memory.multi_evidence_collection"
regex_any = [
  '''(?ix)^\s*(?:what|which)\s+(?:[a-z][a-z'-]+\s+){0,5}(?:has|have|did|do|does|are|were|can|should|would)\b.{0,140}\b(?:all|some|several|multiple|different|various|main|favorite|recommended|suggested|options?|examples?|ideas?|done|attended|visited|read|watched|bought|purchased|tried|used|mentioned|participated)\b''',
  '''(?ix)^\s*(?:what|which)\s+(?:kinds?|types?|ways|options?|examples?|ideas?)\s+(?:of|for|did|do|are|were)\b''',
  '''(?ix)^\s*(?:can|could)\s+you\s+(?:suggest|recommend|list|summarize)\b.{0,140}\b(?:based on|from|across|overall|some|options?|ideas?|examples?)\b'''
]
labels = ["multi_evidence_collection"]
weighted_cues = [
  { cue = "has:list", weight = 1.2 }
]
cue_weight_adjustments = [
  { cue = "things", weight = 0.55 },
  { cue = "ways", weight = 0.55 },
  { cue = "kinds", weight = 0.55 },
  { cue = "types", weight = 0.55 },
  { cue = "options", weight = 0.55 },
  { cue = "ideas", weight = 0.55 },
  { cue = "examples", weight = 0.55 }
]

[[query_rules]]
id = "memory.source_instruction"
contains_any = [
  "asked me to", "ask me to", "told me to", "tell me to", "requested",
  "request", "instructed", "instruction", "instructions", "what did i ask",
  "what did i tell", "what did i request"
]
labels = ["source_instruction"]

[[query_rules]]
id = "memory.instruction_applicable"
regex_any = [
  '''(?ix)^\s*(?:what\s+(?:should|are|is|can|information|tools|options)|how\s+(?:do|should|can|does|did|has|is)|which|when\s+(?:building|creating|implementing|working|using|handling|planning|writing|designing|organizing)\b|if\s+(?:i|we)(?:'m| am|'re| are)?\s+(?:building|creating|implementing|working|using|handling|planning|writing|designing|organizing)\b|can\s+you\s+(?:explain|help|recommend|show|tell)|could\s+you\s+(?:explain|help|recommend|show|tell)|i(?:'m| am)\s+(?:trying|thinking|looking|planning|working|about\s+to)|i\s+(?:need|want)\s+to\b)'''
]
labels = ["instruction_applicable"]

[[query_rules]]
id = "memory.preference_applicable"
regex_any = [
  '''(?ix)^\s*(?:what\s+(?:should|are|is|can|options|steps|ways)|how\s+(?:do|should|can|would)|which|when\s+(?:building|creating|implementing|working|using|handling|planning|writing|designing|organizing|choosing|editing)\b|if\s+(?:i|we)(?:'m| am|'re| are)?\s+(?:building|creating|implementing|working|using|handling|planning|writing|designing|organizing|choosing|editing)\b|can\s+you\s+(?:explain|help|recommend|show|suggest|walk|tell)|could\s+you\s+(?:explain|help|recommend|show|suggest|walk|tell)|i(?:'m| am)\s+(?:trying|thinking|looking|planning|working|about\s+to)|i\s+(?:need|want)\s+to\b)'''
]
labels = ["preference_applicable"]

[[memory_rules]]
id = "memory.standing_instruction.always_when"
regex_any = [
  '''(?is)\balways\s+.{3,220}?\bwhen\s+(?:i|we|the user|users?|someone|people)\s+(?:ask|asks|asked|am asking|are asking)\s+about\s+.{3,220}''',
  '''(?is)\bwhen\s+(?:i|we|the user|users?|someone|people)\s+(?:ask|asks|asked|am asking|are asking)\s+about\s+.{3,220}?\b(?:always|make sure to|remember to|include|specify|confirm|explain|provide)\b''',
  '''(?is)\b(?:make sure to|remember to|please)\s+.{3,220}?\bwhen\s+(?:discussing|covering|answering|responding to|talking about|i\s+ask\s+about|we\s+ask\s+about)\s+.{3,220}'''
]
emits = ["type:standing_instruction", "instruction:conditional", "instruction:always"]

[[memory_rules]]
id = "memory.preference.explicit"
regex_any = [
  '''(?is)\b(?:i|we)\s+(?:really\s+|usually\s+|generally\s+|strongly\s+)?(?:prefer|like|love|enjoy)\s+.{3,220}''',
  '''(?is)\b(?:my|our)\s+preference\s+(?:is|for|would\s+be)\s+.{3,220}''',
  '''(?is)\b(?:i|we)\s+would\s+rather\s+.{3,220}''',
  '''(?is)\b(?:i|we)\s+(?:do\s+not|don't|dont|dislike|avoid|can't\s+stand|cannot\s+stand)\s+.{3,220}'''
]
emits = ["preference:explicit"]

[[memory_rules]]
id = "memory.inline_enumeration"
regex_any = [
  '''(?ix)\b(?:including|such as|for example|for instance|like|especially)\b.{0,160}\b[a-z][a-z'-]+\b\s*,\s*\b[a-z][a-z'-]+\b(?:\s*,\s*|\s+(?:and|or)\s+)\b[a-z][a-z'-]+\b'''
]
emits = ["has:list"]

[[query_rules]]
id = "aquarium.tank_alias"
contains_any = ["aquarium", "aquariums"]
weighted_cues = [
  { cue = "tank", weight = 3.8 }
]

[[query_rules]]
id = "home.bedroom_furniture_alias"
contains_all = ["bedroom", "furniture"]
weighted_cues = [
  { cue = "dresser", weight = 4.2 },
  { cue = "wardrobe", weight = 3.6 },
  { cue = "nightstand", weight = 3.6 }
]

