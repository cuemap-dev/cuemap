[[memory_rules]]
id = "media.music_streaming.regex"
regex_any = [
  '''(?s)\b(?:[Ll]isten(?:ing)?\s+to|[Ss]tream(?:ing)?|[Pp]laying)\b.{0,100}\b(?:[Mm]usic|[Ss]ongs?|[Tt]racks?|[Aa]lbums?|[Aa]rtists?|[Pp]laylists?)\b.{0,80}\bon\s+[A-Z][A-Za-z0-9+.'-]{1,40}\b''',
  '''(?s)\b(?:[Mm]usic|[Ss]ongs?|[Tt]racks?|[Aa]lbums?|[Aa]rtists?|[Pp]laylists?)\b.{0,80}\bon\s+[A-Z][A-Za-z0-9+.'-]{1,40}\b.{0,100}\b(?:[Ll]isten(?:ing)?\s+to|[Ss]tream(?:ing)?|[Pp]laying)\b'''
]
emits = ["media:music", "media:music_streaming", "media:streaming", "type:usage"]

[[memory_rules]]
id = "media.music_streaming.phrase"
contains_any = [
  "music streaming service", "music streaming services", "music streaming platform",
  "music streaming platforms"
]
emits = ["media:music", "media:music_streaming", "media:streaming", "type:usage"]

[[memory_rules]]
id = "media.streaming"
